name: CI

# Compila y prueba el backend Go contra un Postgres real (servicio del runner).
# Aquí se VERIFICA la migración SQLite→Postgres del store (los tests de store y
# conciliación corren contra Postgres vía TEST_DATABASE_URL).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grabi
          POSTGRES_PASSWORD: grabi
          POSTGRES_DB: grabi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grabi -d grabi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: software

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: software/go.sum

      - name: Tidy y descarga de dependencias
        run: go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Test (contra Postgres)
        env:
          TEST_DATABASE_URL: "postgres://grabi:grabi@localhost:5432/grabi_test?sslmode=disable"
        # -p 1: los paquetes 'store' y 'concil' comparten la misma base de pruebas;
        # correrlos en serie evita que el TRUNCATE de uno pise los datos del otro.
        run: go test -p 1 -count=1 ./...

      - name: Build estático (igual que la imagen)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/server ./cmd/server

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen Docker (verificación; sin push)
        run: docker build -t grabi-web:ci ./software

  # Despliegue continuo a la EC2 del piloto (ADR-021, Fase 3).
  # Solo en push a main y solo si test+docker-build pasaron: nunca desplegamos
  # código roto. GitHub Actions asume un rol IAM temporal por OIDC (sin llaves de
  # larga vida) y ejecuta el redeploy en la caja vía AWS SSM (sin abrir SSH).
  # El .env con secretos vive SOLO en la EC2; el pipeline nunca lo toca.
  deploy:
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write   # necesario para pedir el token OIDC
      contents: read
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Configurar credenciales AWS (OIDC, rol temporal)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Redeploy en la EC2 vía SSM
        run: |
          set -euo pipefail
          # El comando remoto corre como ec2-user con shell de login (-i) para que
          # tome HOME=/home/ec2-user (ahí están los plugins docker) y el grupo docker.
          # git reset --hard NO borra archivos ignorados (.env, .keys) → los secretos
          # sobreviven. La cadena va en memoria (bash -c), así que actualizar el repo
          # a mitad de ejecución no corrompe el propio comando.
          cat > /tmp/ssm-params.json <<'JSON'
          {
            "commands": [
              "sudo -iu ec2-user bash -c 'cd ~/Dispensadora-Completo/software && git fetch --all && git reset --hard origin/main && docker compose -f docker-compose.prod.yml up -d --build && docker image prune -f'"
            ],
            "executionTimeout": ["3600"]
          }
          JSON
          CID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $CID"
          IID="${{ vars.EC2_INSTANCE_ID }}"
          # El build en la t3.micro tarda varios minutos, más que el waiter por
          # defecto de AWS (~100s). Sondeamos el estado hasta terminal, con
          # margen amplio (60×15s = 15 min) para no marcar fallo con el build vivo.
          STATUS="Pending"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo "Pending")
            echo "[$i] estado SSM: $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 15
          done
          echo "----- STDOUT (caja) -----"
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardOutputContent --output text || true
          echo "----- STDERR (caja) -----"
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardErrorContent --output text || true
          echo "Estado final del deploy: $STATUS"
          test "$STATUS" = "Success"
